#Workflow
name: cicd
on: workflow_dispatch

#jobs

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        run: echo "Code cloning complete"
  build:
    needs: [code]
    runs-on: ubuntu-latest
    steps:
      - name: Build the code
        run: echo "Build the code"
  test:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Test the code
        run: echo "Test the build"

  deploy:
    needs: [build,test]
    runs-on: ubuntu-latest
    steps:
      - name: deploy the build
        run: echo "Deploy the build"
