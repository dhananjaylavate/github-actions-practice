name: Day 39

on:
    push:

jobs:
    greet:
        runs-on: ubuntu-latest
        steps:
            - name : Checkout the code using actions/checkout
              uses: actions/checkout@v7
            
            - name : Print The hello Message
              run : echo "Hello from GitHub Actions!"
    
    print-date:
        runs-on: ubuntu-latest
        steps:
            - name : Print current date and time
              run: date

            - name : Print formatted date and time
              run: date +"%Y-%m-%d %H:%M:%S"
    
    print-branch-name:
        runs-on: ubuntu-latest
        steps:
            - name: Print the name of the branch that triggered the run
              run: |
                echo "Branch: ${{ github.ref_name }}"

    list-files-in-repo:
        runs-on: ubuntu-latest
        steps:

            - name : Checkout the code
              uses: actions/checkout@v7
              
            - name : List the files
              run: ls -a

            - name : find the files
              run: |
                echo "Finding the files"
                find .






